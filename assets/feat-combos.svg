<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="Model combos, drawn in motion: a call travels a chain of model chips, the first stamps NOT ANSWERING, and the call hops to the next model, which stamps ANSWERED.">
  <rect x="1" y="1" width="878" height="418" rx="18" fill="#050505" stroke="#1F1F1F" stroke-width="2"/>
  <title>Model combos — drawn in motion</title>
  <g font-family="'Public Sans','Segoe UI',Arial,sans-serif">
    <rect x="48" y="44" width="10" height="26" fill="#F5F5F5"/>
    <rect x="64" y="36" width="10" height="34" fill="#0274E7"/>
    <rect x="80" y="44" width="10" height="26" fill="#F5F5F5"/>
    <text x="110" y="68" font-size="30" font-weight="800" letter-spacing="5" fill="#F5F5F5">MODEL COMBOS</text>
    <rect x="112" y="82" width="0" height="3" fill="#0274E7">
      <animate attributeName="width" from="0" to="290" dur="0.9s" begin="0.15s" fill="freeze"/><animate attributeName="width" values="290;252;290" keyTimes="0;0.5;1" begin="1.3s" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <text x="48" y="118" font-family="'IBM Plex Mono',Consolas,monospace" font-size="16" fill="#A1A1A6">One name, a chain of models — if the first will not answer, the next one does.</text>
  </g>
  <rect x="48" y="140" width="784" height="1" fill="#1F1F1F"/>
  <text x="170" y="196" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" letter-spacing="2" fill="#646466">FIRST TRY</text>
  <text x="440" y="196" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" letter-spacing="2" fill="#646466">FAILOVER</text>
  <text x="710" y="196" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" letter-spacing="2" fill="#646466">RESERVE</text>
  <path d="M292 236 l14 6 l-14 6 z" fill="#353638">
    <animate attributeName="opacity" values="0.5;1;0.5" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M562 236 l14 6 l-14 6 z" fill="#353638">
    <animate attributeName="opacity" values="0.5;1;0.5" keyTimes="0;0.5;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </path>
  <g font-family="'IBM Plex Mono',Consolas,monospace">
    <rect x="60" y="210" width="220" height="64" rx="8" fill="#050505" stroke="#1F1F1F">
      <animate attributeName="stroke" values="#1F1F1F;#1F1F1F;#1F1F1F;#1F1F1F;#1F1F1F;#1F1F1F" keyTimes="0;0.1200;0.1500;0.93;0.98;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <circle cx="88" cy="242" r="6" fill="#353638">
      <animate attributeName="fill" values="#353638;#353638;#F5F5F5;#F5F5F5;#353638;#353638" keyTimes="0;0.2200;0.2600;0.93;0.98;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <text x="108" y="248" font-size="15.5" fill="#A1A1A6">MODEL A — KEY 1</text>
  </g>
  <g font-family="'IBM Plex Mono',Consolas,monospace">
    <rect x="330" y="210" width="220" height="64" rx="8" fill="#050505" stroke="#1F1F1F">
      <animate attributeName="stroke" values="#1F1F1F;#1F1F1F;#1F1F1F;#1F1F1F;#1F1F1F;#1F1F1F" keyTimes="0;0.3300;0.3600;0.93;0.98;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <circle cx="358" cy="242" r="6" fill="#353638">
      <animate attributeName="fill" values="#353638;#353638;#0274E7;#0274E7;#353638;#353638" keyTimes="0;0.3800;0.4200;0.93;0.98;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <text x="378" y="248" font-size="15.5" fill="#A1A1A6">MODEL B — LOCAL</text>
  </g>
  <g font-family="'IBM Plex Mono',Consolas,monospace" opacity="0.55">
    <rect x="600" y="210" width="220" height="64" rx="8" fill="#050505" stroke="#1F1F1F"/>
    <circle cx="628" cy="242" r="6" fill="#353638"/>
    <text x="648" y="248" font-size="15.5" fill="#A1A1A6">MODEL C — KEY 2</text>
  </g>
  <g transform="translate(170 242) rotate(-7)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2350;0.2600;0.93;0.97;1" dur="10s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1.6;1.6;1;1;1" keyTimes="0;0.2350;0.2850;0.93;1" dur="10s" repeatCount="indefinite"/>
      <rect x="-108" y="-22" width="216" height="44" rx="6" fill="none" stroke="#F5F5F5" stroke-width="3"/>
      <text x="0" y="7" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-size="18" font-weight="700" letter-spacing="2.5" fill="#A1A1A6">NOT ANSWERING</text>
    </g>
  </g>
  <g transform="translate(440 242) rotate(-7)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4050;0.4300;0.93;0.97;1" dur="10s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1.6;1.6;1;1;1" keyTimes="0;0.4050;0.4550;0.93;1" dur="10s" repeatCount="indefinite"/>
      <rect x="-86" y="-22" width="172" height="44" rx="6" fill="none" stroke="#0274E7" stroke-width="3"/>
      <text x="0" y="7" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-size="18" font-weight="700" letter-spacing="3" fill="#0274E7">ANSWERED</text>
    </g>
  </g>
  <circle cx="30" cy="242" r="9" fill="#0274E7" opacity="0">
    <animate attributeName="cx" values="30;170;170;440;440" keyTimes="0;0.12;0.24;0.33;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="242;242;242;196;242;242" keyTimes="0;0.12;0.24;0.285;0.33;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.94;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <text x="440" y="330" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14.5" letter-spacing="1.5" fill="#A1A1A6" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.36;0.42;0.93;1" dur="10s" repeatCount="indefinite"/>
    THE CALL MOVES — THE WORK DOES NOT STOP
  </text>
  <text x="440" y="394" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-size="13.5" letter-spacing="2" fill="#0274E7" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.52;0.93;1" dur="10s" repeatCount="indefinite"/>
    EVERY MOVE IS RECORDED IN THE MISSION'S MINUTES
  </text>
</svg>
