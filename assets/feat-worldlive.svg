  <g font-family="'IBM Plex Mono',Consolas,monospace">
    <text x="470" y="190" font-size="12.5" letter-spacing="2" fill="#6f7a6c">WORLD RUN — LIVE PROGRESS</text>
    <text x="470" y="232" font-size="17" fill="#e9ead9">ROUND 1 OF 5</text>
    <rect x="470" y="252" width="330" height="16" rx="8" fill="#161a13" stroke="#2a2f22"/>
    <rect x="470" y="252" width="0" height="16" rx="8" fill="#c8ff3d">
      <animate attributeName="width" values="0;0;110;110;220;220" keyTimes="0;0.18;0.34;0.52;0.68;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="470" y="306" font-size="16" fill="#a9b3a4">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.30;0.34;1" dur="12s" repeatCount="indefinite"/>
      0 OF 6 CALLS ANSWERED
    </text>
    <text x="470" y="306" font-size="16" fill="#a9b3a4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.38;0.62;0.66;1" dur="12s" repeatCount="indefinite"/>
      2 OF 6 CALLS ANSWERED
    </text>
    <text x="470" y="306" font-size="16" fill="#e9ead9" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.72;0.94;1" dur="12s" repeatCount="indefinite"/>
      4 OF 6 CALLS ANSWERED · <tspan fill="#c8ff3d">STILL WORKING</tspan>
    </text>
    <text x="470" y="344" font-size="12.5" fill="#8b968a">THE TIME ESTIMATE COMES FROM MEASURED PACE —</text>
    <text x="470" y="364" font-size="12.5" fill="#8b968a">OR THE PANEL SAYS THE TIME IS UNKNOWN.</text>
  </g>
  <g>
