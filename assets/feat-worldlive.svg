<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="The world, live, drawn in motion: a ring of simulated agents lights up call by call while a progress bar fills — round 1 of 5, 4 of 6 calls answered, still working. A simulated estimate — never a prediction.">
  <rect x="1" y="1" width="878" height="418" rx="18" fill="#070907" stroke="#232a23" stroke-width="2"/>
  <title>The world, live — drawn in motion</title>
  <g font-family="'Public Sans','Segoe UI',Arial,sans-serif">
    <rect x="48" y="44" width="10" height="26" fill="#e9ead9"/>
    <rect x="64" y="36" width="10" height="34" fill="#c8ff3d"/>
    <rect x="80" y="44" width="10" height="26" fill="#e9ead9"/>
    <text x="110" y="68" font-size="30" font-weight="800" letter-spacing="5" fill="#e9ead9">THE WORLD, LIVE</text>
    <rect x="112" y="82" width="0" height="3" fill="#c8ff3d">
      <animate attributeName="width" from="0" to="365" dur="0.9s" begin="0.15s" fill="freeze"/><animate attributeName="width" values="365;318;365" keyTimes="0;0.5;1" begin="1.3s" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <text x="48" y="118" font-family="'IBM Plex Mono',Consolas,monospace" font-size="16" fill="#8b968a">A society run shows its work — every answered call lands on the record, live.</text>
  </g>
