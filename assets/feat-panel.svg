<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-label="The panel and missions, drawn in motion: a job card travels between four seated agents, each checks it, a verdict stamp lands, and a Proof Pack sheet slides out.">
  <rect x="1" y="1" width="878" height="468" rx="18" fill="#070907" stroke="#232a23" stroke-width="2"/>
  <title>The panel — missions, drawn in motion</title>
  <g font-family="'Public Sans','Segoe UI',Arial,sans-serif">
    <rect x="48" y="44" width="10" height="26" fill="#e9ead9"/>
    <rect x="64" y="36" width="10" height="34" fill="#c8ff3d"/>
    <rect x="80" y="44" width="10" height="26" fill="#e9ead9"/>
    <text x="110" y="68" font-size="30" font-weight="800" letter-spacing="5" fill="#e9ead9">THE PANEL</text>
    <rect x="112" y="82" width="0" height="3" fill="#c8ff3d">
      <animate attributeName="width" from="0" to="262" dur="0.9s" begin="0.15s" fill="freeze"/><animate attributeName="width" values="262;227;262" keyTimes="0;0.5;1" begin="1.3s" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <text x="48" y="118" font-family="'IBM Plex Mono',Consolas,monospace" font-size="16" fill="#8b968a">One job, heard by four specialists — checked, stamped, delivered with its Proof Pack.</text>
  </g>
  <rect x="48" y="140" width="784" height="1" fill="#232a23"/>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.845;0.885;0.965;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 16;0 16;0 0;0 0;0 16" keyTimes="0;0.845;0.885;0.965;1" dur="12s" repeatCount="indefinite"/>
    <rect x="56" y="192" width="186" height="94" rx="8" fill="#11140f" stroke="#2a2f22"/>
    <text x="72" y="218" font-family="'IBM Plex Mono',Consolas,monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#c8ff3d">PROOF PACK</text>
    <path d="M74 237 l4 5 l7 -9" fill="none" stroke="#c8ff3d" stroke-width="2.4" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8800;0.8950;0.965;1" dur="12s" repeatCount="indefinite"/></path>
    <text x="92" y="242" font-family="'IBM Plex Mono',Consolas,monospace" font-size="13.5" fill="#a9b3a4">the plan</text>
