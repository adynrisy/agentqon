    <text x="92" y="260" font-family="'IBM Plex Mono',Consolas,monospace" font-size="13.5" fill="#a9b3a4">the evidence</text>
    <path d="M74 273 l4 5 l7 -9" fill="none" stroke="#c8ff3d" stroke-width="2.4" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.9400;0.9550;0.965;1" dur="12s" repeatCount="indefinite"/></path>
    <text x="92" y="278" font-family="'IBM Plex Mono',Consolas,monospace" font-size="13.5" fill="#a9b3a4">the cost</text>
